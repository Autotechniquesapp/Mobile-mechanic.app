name: Validate Mobile Mechanic AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check admin-access.js
          node --check legal-protections.js
          node --check referral-tracking.js
          node --check estimate-approvals.js
          node --check estimate-public.js
          node --check supabase-production.js
          node --check pricing-gates.js
          node --check production-guards.js
          node --check intake-queue.js
          node --check payment-processors.js
          node --check quickbooks-integration.js
          node --check stripe-billing.js
          node --check stripe-connect.js
          node --check stripe-job-payment.js
          node --check technician-help.js
      - name: Check required production files
        run: |
          test -f index.html
          test -f admin.html
          test -f admin.js
          test -f admin-access.js
          test -f terms.html
          test -f legal-protections.js
          test -f referral-tracking.js
          test -f styles.css
          test -f netlify.toml
          test -f estimate-approvals.js
          test -f estimate-public.js
          test -f pricing-gates.js
          test -f intake-queue.js
          test -f payment-processors.js
          test -f quickbooks-integration.js
          grep -q "admin-access.js" index.html
          grep -q "legal-protections.js" index.html
          grep -q "referral-tracking.js" index.html
          grep -q "estimate-approvals.js" index.html
          grep -q "estimate-public.js" index.html
          grep -q "supabase-production.js" index.html
          grep -q "pricing-gates.js" index.html
          grep -q "production-guards.js" index.html
          grep -q "intake-queue.js" index.html
          grep -q "payment-processors.js" index.html
          grep -q "quickbooks-integration.js" index.html
          grep -q "from = \"/terms\"" netlify.toml
          grep -q "from = \"/admin\"" netlify.toml
