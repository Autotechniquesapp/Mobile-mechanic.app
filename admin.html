<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <title>Mobile Mechanic AI — Platform Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:#07090c;color:#f4f6f8;margin:0;font-family:Inter,Arial,sans-serif}.admin-shell{max-width:1450px;margin:0 auto;padding:18px}.admin-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0 20px}.admin-brand{font-size:22px;font-weight:900;letter-spacing:.2px}.admin-brand span{color:#ef2a31}.admin-spacer{flex:1}.admin-grid{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:12px}.admin-card{background:#101318;border:1px solid #2a2e35;border-radius:14px;padding:16px}.admin-card.red{border-color:#ef2a31;box-shadow:0 0 22px rgba(239,42,49,.08)}.metric b{font-size:28px;display:block;margin-top:6px}.metric small,.muted{color:#9aa1aa}.section{margin-top:18px}.section h2{margin:0 0 12px}.admin-table-wrap{overflow:auto;border:1px solid #2a2e35;border-radius:14px}.admin-table{width:100%;border-collapse:collapse;min-width:1050px;background:#101318}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #252930;vertical-align:middle}.admin-table th{font-size:12px;color:#a9afb8;text-transform:uppercase;letter-spacing:.06em}.admin-actions{display:flex;gap:7px;flex-wrap:wrap}.admin-btn{border:1px solid #3a3f48;background:#171b21;color:#fff;padding:8px 10px;border-radius:9px;cursor:pointer}.admin-btn:hover{border-color:#ef2a31}.admin-btn.primary{background:#ef2a31;border-color:#ef2a31}.admin-btn.danger{border-color:#8a3034}.admin-select,.admin-input{background:#0c0f13;color:#fff;border:1px solid #373c45;border-radius:9px;padding:9px}.status{font-size:12px;padding:5px 8px;border-radius:999px;border:1px solid #3a3f48;display:inline-block}.status.active,.status.comped{border-color:#2b8b57}.status.trialing{border-color:#a47825}.status.past_due,.status.suspended{border-color:#a33d42}.owner-shop{color:#ef2a31;font-size:11px;font-weight:800}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#101318;border:1px solid #ef2a31;border-radius:18px;padding:24px;box-shadow:0 0 35px rgba(239,42,49,.1)}.login-card h1{margin:0 0 6px}.login-card .field{margin:14px 0}.login-card label{display:block;margin-bottom:6px;font-size:13px;color:#b3b9c2}.login-card input{width:100%;box-sizing:border-box;background:#090b0e;color:#fff;border:1px solid #383d45;border-radius:10px;padding:12px}.login-card button{width:100%;margin-top:8px}.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.activity{display:grid;gap:8px}.activity-row{background:#101318;border:1px solid #252930;border-radius:10px;padding:11px}.error{color:#ff6b70}.success{color:#70d49b}@media(max-width:950px){.admin-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div id="adminApp"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="admin.js"></script>
</body>
</html>
