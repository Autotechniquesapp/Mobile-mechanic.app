<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <title>Mobile Mechanic AI — Platform Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root{--bg:#050608;--panel:#0d1116;--panel2:#11161c;--line:#28313b;--line2:#343d47;--text:#f6f7f9;--muted:#8e98a5;--red:#ef2a31;--green:#3bb86b;--orange:#f49a20;--shadow:0 18px 55px rgba(0,0,0,.34);--safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html{background:#040507}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 50% -10%,#171b21 0,#080a0d 33%,#040507 75%);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .admin-shell{width:min(100%,1180px);margin:0 auto;min-height:100vh;padding:calc(12px + var(--safeTop)) 12px calc(26px + var(--safeBottom))}
    .admin-top{position:sticky;top:0;z-index:20;margin:calc(-12px - var(--safeTop)) -12px 14px;padding:calc(12px + var(--safeTop)) 12px 12px;display:flex;align-items:center;gap:10px;background:rgba(5,7,10,.94);backdrop-filter:blur(18px);border-bottom:1px solid #202731}
    .admin-mark{width:45px;height:45px;border-radius:10px;background:#151a21;border:1px solid #2b333d;display:grid;place-items:center;color:var(--red);font-weight:950;letter-spacing:.4px;flex:0 0 auto}
    .admin-title{min-width:0;line-height:1.05}.admin-brand{font-size:17px;font-weight:950;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-brand span{color:var(--red)}.admin-sub{margin-top:4px;color:var(--muted);font-size:11px}
    .admin-spacer{flex:1}.admin-actions-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .admin-btn{min-height:38px;border:1px solid #343c46;background:#151a21;color:#f8f9fb;padding:8px 11px;border-radius:9px;cursor:pointer;font-weight:780;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.admin-btn:hover{filter:brightness(1.08);border-color:#5d2529}.admin-btn.primary{background:linear-gradient(180deg,#ee3037,#bd171d);border-color:#ff4b50;box-shadow:0 5px 20px rgba(239,42,49,.22)}.admin-btn.danger{background:#281013;border-color:#7a282d;color:#ff9297}
    .status{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid #3a3f48;background:#11161c;color:#dce1e7;display:inline-flex;align-items:center;white-space:nowrap}.status.active,.status.comped{border-color:#2b8b57;color:#75d894}.status.trialing{border-color:#a47825;color:#eebf61}.status.past_due,.status.suspended{border-color:#a33d42;color:#ff9297}
    #adminNote{min-height:19px;margin:0 2px 10px}.error{color:#ff6b70}.success{color:#70d49b}.muted{color:var(--muted)}
    .admin-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.admin-card{background:linear-gradient(180deg,#10151b,#0b0f14);border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:0 8px 28px rgba(0,0,0,.18)}.admin-card.red{border-color:#893137;box-shadow:inset 0 0 0 1px rgba(239,42,49,.12),0 8px 28px rgba(0,0,0,.18)}.metric b{font-size:23px;display:block;margin-top:5px;line-height:1.1}.metric small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
    .admin-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;margin-top:12px}.section{min-width:0}.section h2{margin:0 0 9px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}.admin-panel{background:linear-gradient(180deg,#10151b,#0b0f14);border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid #242b33}.panel-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.panel-head h2{margin:0}
    .admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:820px}.admin-table th,.admin-table td{text-align:left;padding:11px 12px;border-bottom:1px solid #242b33;vertical-align:middle}.admin-table th{font-size:10px;color:#a9afb8;text-transform:uppercase;letter-spacing:.7px}.admin-table tr:hover td{background:#11171e}.shop-name{font-weight:850}.shop-slug{font-size:11px;color:var(--muted);margin-top:2px}.owner-shop{color:#ff6b70;font-size:10px;font-weight:850;letter-spacing:.4px;text-transform:uppercase}
    .admin-actions{display:flex;gap:6px;flex-wrap:wrap}.admin-select{background:#0b0f14;color:#f6f7f8;border:1px solid #303945;border-radius:8px;padding:8px;min-height:38px}
    .side-stack{display:grid;gap:10px}.ref-grid{display:grid;gap:8px}.activity{display:grid;gap:8px;padding:12px}.activity-row{background:#0c1015;border:1px solid #252d36;border-radius:8px;padding:10px}.activity-row b{font-size:12px}.activity-row .muted{font-size:11px;margin-top:3px}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#1b2027 0,#090b0f 38%,#050608 72%)}.login-card{width:min(430px,100%);background:linear-gradient(180deg,#11161c,#090c10);border:1px solid #893137;border-radius:12px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.login-card h1{margin:0 0 6px;text-transform:uppercase;line-height:1.05}.login-card h1 span{color:var(--red)}.login-card .field{margin:14px 0}.login-card label{display:block;margin-bottom:6px;font-size:11px;color:#b3b9c2}.login-card input{width:100%;background:#090b0e;color:#fff;border:1px solid #383d45;border-radius:8px;padding:12px}.login-card button{width:100%;margin-top:8px}
    @media(max-width:980px){.admin-grid{grid-template-columns:repeat(3,1fr)}.admin-main{grid-template-columns:1fr}.admin-actions-top .status{display:none}}
    @media(max-width:680px){.admin-shell{padding-left:10px;padding-right:10px}.admin-top{align-items:flex-start}.admin-brand{font-size:14px}.admin-sub{font-size:10px}.admin-actions-top{width:100%;justify-content:stretch}.admin-actions-top .admin-btn{flex:1}.admin-grid{grid-template-columns:repeat(2,1fr)}.metric b{font-size:21px}.admin-card{padding:11px}.admin-table-wrap{overflow:visible}.admin-table{min-width:0}.admin-table thead{display:none}.admin-table,.admin-table tbody,.admin-table tr,.admin-table td{display:block;width:100%}.admin-table tr{padding:10px 12px;border-bottom:1px solid #242b33}.admin-table td{border:0;padding:5px 0}.admin-table td:before{content:attr(data-label);display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}.admin-actions .admin-btn,.admin-select{width:100%}}
  </style>
</head>
<body>
  <div id="adminApp"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="admin.js"></script>
</body>
</html>
